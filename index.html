<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Card Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Styling untuk kotak preview foto */
        .img-preview { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
        .preview-container { position: relative; display: inline-block; margin-right: 10px; margin-bottom: 10px; }
        .remove-btn { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 p-6 font-sans">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Buat Kartu Ulang Tahun</h2>
        
        <form id="cardForm">
            <!-- Data Diri -->
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">Nama Lengkap Penerima</label>
                <input type="text" id="namaLengkap" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="mb-4 flex gap-4">
                <div class="w-1/2">
                    <label class="block text-gray-700 font-bold mb-2">Nama Panggilan</label>
                    <input type="text" id="namaPanggilan" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="w-1/2">
                    <label class="block text-gray-700 font-bold mb-2">Tanggal Lahir (Untuk Countdown)</label>
                    <input type="date" id="tglLahir" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Pesan -->
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">Isi Ucapan</label>
                <textarea id="ucapan" rows="4" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- Pilihan Musik -->
            <div class="mb-4 bg-gray-50 p-4 rounded-lg border">
                <label class="block text-gray-700 font-bold mb-2">Pilih Backsound Lagu</label>
                
                <div class="flex items-center justify-between mb-2">
                    <div>
                        <input type="radio" name="musik" value="lagu1.mp3" checked> Lagu Romantis (Default)
                    </div>
                    <!-- Dummy Audio untuk preview -->
                    <audio id="audio1" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
                    <button type="button" onclick="playPause('audio1')" class="bg-blue-500 text-white px-3 py-1 rounded text-sm"><i class="fas fa-play"></i> Play</button>
                </div>
                <div class="flex items-center justify-between mb-2">
                    <div>
                        <input type="radio" name="musik" value="lagu2.mp3"> Lagu Ceria
                    </div>
                    <audio id="audio2" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>
                    <button type="button" onclick="playPause('audio2')" class="bg-blue-500 text-white px-3 py-1 rounded text-sm"><i class="fas fa-play"></i> Play</button>
                </div>
                <div class="flex items-center justify-between">
                    <div>
                        <input type="radio" name="musik" value="lagu3.mp3"> Lagu Lo-Fi
                    </div>
                    <audio id="audio3" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"></audio>
                    <button type="button" onclick="playPause('audio3')" class="bg-blue-500 text-white px-3 py-1 rounded text-sm"><i class="fas fa-play"></i> Play</button>
                </div>
                
                <div class="mt-4 pt-3 border-t">
                    <label class="block text-sm text-gray-600 mb-1">Atau Import Lagu Sendiri (MP3)</label>
                    <input type="file" id="customMusik" accept="audio/*" class="w-full text-sm">
                </div>
            </div>

            <!-- Upload Foto -->
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2">Upload Foto (Bisa lebih dari 1)</label>
                <input type="file" id="fotoUpload" accept="image/*" multiple class="mb-2" onchange="previewImages()">
                
                <!-- Tempat tampilnya preview foto -->
                <div id="imagePreviewContainer" class="flex flex-wrap mt-2"></div>
            </div>

            <!-- Tombol Generate -->
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                <i class="fas fa-magic mr-2"></i> Generate Link Kartu
            </button>
        </form>

        <!-- Area Hasil Generate Link -->
        <div id="resultArea" class="hidden mt-8 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
            <h3 class="font-bold mb-2">Sukses! Ini Link Kartu Ulang Tahunnya:</h3>
            <div class="flex items-center gap-2">
                <input type="text" id="generatedLink" readonly class="w-full px-2 py-1 border rounded bg-white" value="">
                <button type="button" onclick="copyLink()" class="bg-blue-600 text-white px-3 py-1 rounded">Copy</button>
            </div>
            <p class="text-sm mt-2 text-gray-600">ID unik Anda: <span id="uniqueId" class="font-bold"></span></p>
        </div>

    </div>

    <!-- JavaScript Logika Form -->
    <script>
        // Logika Play/Pause Lagu Preview
        let currentAudio = null;
        function playPause(audioId) {
            const audio = document.getElementById(audioId);
            if (currentAudio && currentAudio !== audio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            if (audio.paused) {
                audio.play();
                currentAudio = audio;
            } else {
                audio.pause();
            }
        }

        // Logika Preview Foto Multiple dan Hapus (Tanda X)
        let selectedFiles = [];
        function previewImages() {
            const fileInput = document.getElementById('fotoUpload');
            const container = document.getElementById('imagePreviewContainer');
            
            const newFiles = Array.from(fileInput.files);
            selectedFiles = selectedFiles.concat(newFiles);
            renderPreviews();
            
            // Reset input agar bisa tambah foto lagi
            fileInput.value = ''; 
        }

        function renderPreviews() {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const div = document.createElement('div');
                    div.className = 'preview-container';
                    div.innerHTML = `
                        <img src="${e.target.result}" class="img-preview">
                        <div class="remove-btn" onclick="removeImage(${index})">X</div>
                    `;
                    container.appendChild(div);
                }
                reader.readAsDataURL(file);
            });
        }

        function removeImage(index) {
            selectedFiles.splice(index, 1);
            renderPreviews();
        }

        // Simulasi Proses Submit dan Generate Link
        document.getElementById('cardForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah halaman reload
            
            // Nantinya di bagian ini kita pasang Fetch API ke Google Apps Script
            
            // Simulasi Generate Random ID
            const randomID = 'HBD-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            
            // Simulasi URL (Nantinya parameter ID ini yang dipakai untuk mengambil data di halaman kartu)
            // Di sini saya langsung menggunakan format nama repository yang tadi Anda buat
            const baseUrl = 'https://faisaladha.github.io/BirthdayCard.github.io/card.html'; 
            const finalLink = `${baseUrl}?id=${randomID}`;
            
            // Tampilkan Hasil
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('generatedLink').value = finalLink;
            document.getElementById('uniqueId').innerText = randomID;
        });

        function copyLink() {
            const copyText = document.getElementById("generatedLink");
            copyText.select();
            document.execCommand("copy");
            alert("Link berhasil di-copy!");
        }
    </script>

</body>
</html>
